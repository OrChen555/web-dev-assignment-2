<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חלליות וכוכבים - משחק Flexbox</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>חלליות וכוכבים</h1>
        <p>משחק ללימוד Flexbox</p>
    </header>

    <main>
        <div class="board-area">
            <div class="board">
                <div class="items" id="items"></div>
            </div>
        </div>

        <div class="panel">
            <p class="level-count" id="level-count">שלב 1 מתוך 6</p>
            <p class="instruction" id="instruction">ההוראה של השלב תופיע כאן.</p>

            <div class="controls" id="controls"></div>

            <div class="buttons">
                <button type="button" id="check-button">בדיקת פתרון</button>
                <button type="button" class="secondary" id="reset-button">איפוס השלב</button>
                <button type="button" id="next-button" hidden>לשלב הבא</button>
            </div>

            <p class="message" id="message"></p>
        </div>
    </main>

    <footer>
        <p>תרגיל 2 - פיתוח אתרים</p>
    </footer>

    <script src="js/levels.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
